version: 2

models:
  - name: fct_orders
    description: "Final clean orders table excluding refunded orders."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - accepted_values:
              values: ['completed', 'pending']