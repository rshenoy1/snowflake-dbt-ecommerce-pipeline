version: 2

models:
  - name: fct_orders
    description: "Final clean orders table excluding refunded orders."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: ['completed', 'pending']

  - name: dim_customers
    description: "Customer dimension table with order counts and lifetime value."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - unique
          - not_null